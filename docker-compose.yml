version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: thetiptop-postgres
    environment:
      POSTGRES_DB: thetiptop
      POSTGRES_USER: tiptop
      POSTGRES_PASSWORD: tiptop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiptop -d thetiptop"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: thetiptop-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@thetiptop.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - postgres
    volumes:
      - ./docker/pgadmin:/var/lib/pgadmin

